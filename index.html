<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSM STORE - Réparation & Vente de Smartphones</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        header { background: #222; color: #fff; padding: 20px; text-align: center; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        h1 { color: #007bff; margin: 20px 0; }
        .services { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 20px 0; }
        .service { background: #f4f4f4; padding: 20px; border-radius: 5px; }
        footer { background: #222; color: #fff; text-align: center; padding: 20px; margin-top: 40px; }
    </style>
</head>
<body>
    <header>
        <h1>📱 GSM STORE</h1>
        <p>Réparation & Vente de Smartphones à Marseille</p>
    </header>
    
    <div class="container">
        <h2>Nos Services</h2>
        <div class="services">
            <div class="service">
                <h3>🔧 Réparation</h3>
                <p>Écran, batterie, diagnostic et bien plus</p>
            </div>
            <div class="service">
                <h3>📱 Vente</h3>
                <p>iPhone, Samsung, Oppo et accessoires</p>
            </div>
            <div class="service">
                <h3>⚡ Rapide</h3>
                <p>Service rapide et professionnel</p>
            </div>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2026 GSM STORE - Tous droits réservés</p>
    </footer>
</body>
</html>
